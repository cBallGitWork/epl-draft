name: Node
description: Node 22 with the npm cache, then npm ci. Every workflow's setup but the watchdog's, which keeps its own.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
