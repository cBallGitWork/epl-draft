name: Capture staleness

# The watchdog. Fails loudly when either league has gone too long without a
# capture, which is the failure this project is actually designed against.
#
# **Separate from `capture.yml` on purpose, and on a different schedule.** If the
# job that captures were also the job that reported on capturing, then the way it
# most plausibly dies — the workflow stops running at all — is exactly the way it
# would stop reporting. The sibling project's per-gameweek capture died silently
# at GW35 and was rescued only because FPL's bootstrap is a public URL the
# Internet Archive crawls. Nothing crawls our league. Silence is the enemy, so the
# noticing lives in its own workflow that would still fire if the other never ran
# again.
#
# `npm run capture:status` exits non-zero when overdue, which fails the job, and the
# last step opens the issue "alert: capture-status" for the owner (`scripts/ci/alert.sh`).
# A red run alone reached nobody: GitHub mails only whoever last edited the cron.

on:
  schedule:
    # 14:25 UTC daily — mid-afternoon UK, nine hours after the capture is due, so
    # a missed run is reported the same day rather than the next.
    - cron: "25 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Per league: the two draft nine weeks apart, so the rehearsal league is
      # already on the daily cadence while the real one is still weekly. One
      # combined answer would hide whichever of them stopped.
      - name: Check both leagues
        run: npm run capture:status

      # Every red or timed-out run opens or updates the issue "alert: capture-status"; the next green one closes it.
      - name: Alert the owner
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/alert.sh capture-status fail "$RUN_URL"

      - name: Close the alert
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/alert.sh capture-status ok "$RUN_URL"
