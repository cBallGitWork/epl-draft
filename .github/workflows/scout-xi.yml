name: Scout XI

# Scout's predicted elevens into `data/intel/xi/26-27.json`, so the club pages show the
# latest one without anybody exporting it by hand (Craig, 23 Sep 2026: "It should just
# always be live, and it's updated when scout updates it"). `npm run scout-xi` writes only
# when an eleven changed, so most runs commit nothing; a commit that does land redeploys,
# because `vercel.json` does not exclude `data/intel`.

on:
  schedule:
    # Every two hours Thursday to Saturday, while pressers and team news move the elevens; once a
    # day otherwise (Craig, 7 Oct 2026: 84 runs a week had committed nothing in seven days).
    - cron: "40 7-21/2 * * 4,5,6"
    - cron: "40 6 * * 0,1,2,3"
  workflow_dispatch: {}

# Its own group, on `editions.yml`'s reasoning: a shared group lets one workflow cancel
# another's queued run. Rebasing before the push keeps them apart.
concurrency:
  group: scout-xi
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read Scout's elevens
        run: npm run scout-xi

      - name: Commit them, if they changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add data/intel/xi
          scripts/ci/push.sh "data: Scout's predicted elevens, $(date -u +%Y-%m-%dT%H:%MZ)" "Scout's elevens have not changed."

      # Every red or timed-out run opens or updates the issue "alert: scout-xi"; the next green one closes it.
      - name: Alert the owner
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/alert.sh scout-xi fail "$RUN_URL"

      - name: Close the alert
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/alert.sh scout-xi ok "$RUN_URL"
