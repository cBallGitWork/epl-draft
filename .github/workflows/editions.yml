name: Editions

# The paper's written columns.
#
# **Facts are live and prose is published.** Everything countable on the front
# page updates on the app's own thirty-second poll; a column cannot, because one
# rewritten every thirty seconds is not a column and a sentence about a score
# that has since moved is worse than no sentence. So the writing happens here,
# off the app entirely, and lands as data.
#
# The paper rolls: the newsdesk (`gazette/newsdesk.ts`) decides what is
# newsworthy each firing — a round column, a match report as a fixture
# finishes, a tie newly decided, tonight's preview — and the script files up to
# GAZETTA_STORY_CAP of it. The crons are only when the desk LOOKS; the
# newsdesk's triggers decide what files, so a rearranged calendar changes
# data, not this file.
#
# **It fires far more often than it writes, and that is the design.** GitHub's
# schedules are routinely late and sometimes skipped, and our lock is fifteen
# minutes before the first kickoff — a window no cron can be trusted to hit. So
# it runs on a wide net and the guards decide: nothing new exits 0 after one
# snapshot read and a local ledger check. The common run costs a `npm ci` and
# an HTTP request.
#
# Cost when it DOES write: at most GAZETTA_STORY_CAP (10, set below) stories
# per firing, and one Anthropic call each. A desk that refuses spends nothing,
# so a firing costs what it FILES rather than what it considers. The
# Actions-minutes budget is still the real spend — roughly 110 runs a
# week at a minute or two each against the 2000 free monthly minutes shared
# with capture and round-state — and this cron block is the data to trim if
# that ever bites.
#
# Setup, once: ANTHROPIC_API_KEY as a repository secret. The key lives here and
# never on Vercel — the app reads the committed paper and never writes one.
# OPENAI_API_KEY is the second, and it is optional: without it every edition
# files exactly as it does now, with a typographic band instead of a drawing.

on:
  schedule:
    # The lock window. Locks land Friday evening or Saturday lunchtime depending
    # on the round's first kickoff, so this covers both without knowing which.
    - cron: "0,30 17-23 * * 5"
    - cron: "0,30 10-16 * * 6"
    # The match windows: Saturday and Sunday afternoons into the evening, and
    # weekday evenings for the Friday/Monday fixtures — match reports and tie
    # calls file as things finish, and the round report rides the same net.
    - cron: "0,30 11-22 * * 6,0"
    - cron: "0,30 17-22 * * 1,2,5"
    # The morning-after sweep: whatever the evening net missed — a late whistle,
    # a skipped run — files with coffee rather than waiting for football.
    - cron: "15 6-9 * * 0,1,2"
    # Waiver business. Claims process Wednesday evening (Craig), and NO API read
    # carries that schedule, so the Mercato Wire's trigger is DETECTION — a
    # fresh claim batch in the transactions feed — and these crons are only when
    # we look. The league clock is Europe/London and crons are UTC: 17-22 UTC is
    # evening under both BST and GMT, which is why this mirrors the weekday band
    # rather than picking an hour. Thursday morning catches a batch that landed
    # after the last Wednesday firing.
    - cron: "0,30 17-22 * * 3"
    - cron: "15 6-9 * * 4"
  workflow_dispatch: {}

# Its own group, deliberately NOT shared with the capture or round-state jobs:
# GitHub keeps only the latest PENDING run per group, so a shared group would let
# one workflow silently cancel another's queued run. Rebasing before push is what
# keeps them out of each other's way, not queueing.
concurrency:
  group: editions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: File the column, if one is due
        env:
          # Stories one firing may file. Ten, because the newsdesk offers a
          # dozen assignments for a finished round and the cap used to stop at
          # two — which, with two kinds that refused every time, filed nothing
          # at all for a whole period. The ledger refuses an already-covered
          # key, so no cap can file the same story twice, and match reports
          # gate on each FIXTURE finishing, so a Saturday firing cannot spend a
          # round whose Sunday and Monday games are still to come.
          GAZETTA_STORY_CAP: "10"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The splash drawing. Optional by design: unset, it expands to "" and
          # the writer files the paper without a picture rather than failing
          # after the prose has been paid for.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The league the column is about. This job's environment is not the
          # app's, so it inherits nothing from Vercel: on 10 Oct this has to move
          # with it. Unset, it expands to "" and `FANTRAX_LEAGUE_ID` falls back
          # to the rehearsal league rather than to a blank id.
          FANTRAX_LEAGUE_ID: ${{ vars.FANTRAX_LEAGUE_ID }}
        run: npm run edition

      - name: Commit the edition, if one was written
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The drawings ride with the edition that references them: a
          # story pointing at a file the same commit did not carry is a
          # broken image on the front page.
          git add data/editions apps/companion/public/paper
          # The ordinary outcome: a guard said no column was due, so the run did
          # its one snapshot read and stopped.
          if git diff --cached --quiet; then
            echo "No column due."
            exit 0
          fi
          git commit -m "data: the paper for $(date -u +%Y-%m-%d)"
          # Rebase, never merge. Vercel's ignoreCommand reads `git diff HEAD^
          # HEAD`, and a merge commit's first parent is our own tip — so the diff
          # it evaluated would be the OTHER side's files and the build would be
          # skipped, leaving a column nobody can read.
          git pull --rebase --autostash
          git push
