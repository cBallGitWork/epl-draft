name: Ratings

# Our mark for every man in every settled match day into `data/ratings/26-27.json`, which the player pages read.
# `npm run ratings` rates only days FPL has closed and the file does not hold, so most runs read two things and commit
# nothing; a commit that lands redeploys, because `vercel.json` does not exclude `data/ratings`.

on:
  schedule:
    # Match evenings, when FPL settles a day an hour or two after its last whistle (UTC; the league's clock is London).
    - cron: "20 21,23 * * 5,6,0,1"
    # And a morning sweep, for a day that settled overnight.
    - cron: "20 7 * * *"
  workflow_dispatch: {}

# Its own group, on `editions.yml`'s reasoning: a shared group lets one workflow cancel another's queued run.
concurrency:
  group: ratings
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The marks are the scoring league's points (`data/leagues/recorded.json`), whichever league production serves.
      - name: Rate the settled days
        run: npm run ratings

      - name: Commit them, if any were rated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add data/ratings
          scripts/ci/push.sh "data: ratings, $(date -u +%Y-%m-%dT%H:%MZ)" "No match day was due a rating."

      # Every red or timed-out run opens or updates the issue "alert: ratings"; the next green one closes it.
      - name: Alert the owner
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/alert.sh ratings fail "$RUN_URL"

      - name: Close the alert
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/alert.sh ratings ok "$RUN_URL"
