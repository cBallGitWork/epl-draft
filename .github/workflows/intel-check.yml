name: Intel staleness

# The watchdog for the football intel under `data/intel/`, which the app and the paper read and
# which nothing in Verify checks. `npm run intel-check` exits 1 when a file is absent or will not
# parse, when one is past its kind's age limit (`INTEL_AGE_LIMIT_DAYS` in
# `packages/core/src/football/intel/freshness.ts`), when a predicted club is not an eleven, and
# when the eleven is for a gameweek already played. A red run opens the issue "alert: intel-check".
#
# Its own job, not the producers': `scout-xi.yml` and the Mac's `scripts/sync-intel.sh` fail most
# plausibly by not running, which would silence a check that lived inside them.
#
# Not on `pull_request`: a stale export is a fact about the data, not the branch, and would turn
# every PR red with nothing in it to fix.

on:
  schedule:
    # 05:55 UTC daily: after `ingest-stats.yml` at 05:40, before the first `editions.yml` firing at 06:15.
    - cron: "55 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/node

      # Reads FPL's public bootstrap to learn whether the eleven's gameweek has been played.
      - name: Check the intel export
        run: npm run intel-check

      # A red or timed-out run opens or updates the issue "alert: intel-check"; the next green one closes it.
      - uses: ./.github/actions/alert
        if: ${{ always() }}
        with:
          source: intel-check
          status: ${{ job.status }}
