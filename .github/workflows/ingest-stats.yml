name: Stats league

# The stats league's season-to-date counts into `data/intel/stats/26-27.json` (`npm run stats`),
# for the attribute grid and every screen that wants a count FPL does not publish. It writes only
# when a figure changed, and refuses without writing on a projection or a changed set of columns.

on:
  schedule:
    # 05:40 UTC daily: after the night's matches have settled, before `intel-check` at 05:55.
    - cron: "40 5 * * *"
  workflow_dispatch: {}

# Its own group, on `scout-xi.yml`'s reasoning: a shared group lets one workflow cancel another's queued run.
concurrency:
  group: ingest-stats
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/node

      - name: Read the stats league
        run: npm run stats

      - name: Commit them, if they changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add data/intel/stats
          scripts/ci/push.sh "data: the stats league's counts, $(date -u +%Y-%m-%dT%H:%MZ)" "The stats league's counts have not changed."

      # A red or timed-out run opens or updates the issue "alert: ingest-stats"; the next green one closes it.
      - uses: ./.github/actions/alert
        if: ${{ always() }}
        with:
          source: ingest-stats
          status: ${{ job.status }}
