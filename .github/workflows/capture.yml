name: Capture Fantrax

# Records both leagues and the player pool, every day, and commits the result.
#
# This is the only way our league's history will ever exist. Fantrax serves
# current state only and nothing crawls a private league id, so a day not written
# down is a day gone — no backfill, not from them and not from anywhere else.
#
# A failed read is recorded in its manifest and the rest of the day still captured; the
# capture step then goes red, and the commit step runs anyway so the partial day is kept.
# `capture-status.yml` notices when captures stop arriving altogether.

on:
  schedule:
    # 05:10 UTC daily. After any overnight waiver processing, and off the hour
    # because everyone schedules on the hour and GitHub queues those runs.
    - cron: "10 5 * * *"
    # 17:10 UTC, the backup: a missed morning cannot be backfilled, so the evening tries again. It
    # stands down when the morning's capture on main recorded every league and the pool.
    - cron: "10 17 * * *"
  workflow_dispatch:

# Least privilege: this job writes commits and nothing else.
permissions:
  contents: write
  issues: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Capture every recorded league and the pool
        env:
          BACKUP: ${{ github.event.schedule == '10 17 * * *' }}
        run: |
          if [ "$BACKUP" = true ]; then npm run capture -- --unless-captured; else npm run capture; fi

      - name: Commit the snapshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nothing to commit is normal when the backup stood down. A re-run on the same London
          # day rewrites that day's files, and commits whatever Fantrax now says differently.
          git add data/snapshots
          scripts/ci/push.sh "chore: capture Fantrax $(date -u +%Y-%m-%d)" "No change in today's capture."

      # Every red or timed-out run opens or updates the issue "alert: capture"; the next green one closes it.
      - name: Alert the owner
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/alert.sh capture fail "$RUN_URL"

      - name: Close the alert
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/alert.sh capture ok "$RUN_URL"
